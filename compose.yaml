services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      uvicorn factoryassist.api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /root/.cache/huggingface

    volumes:
      - ./artifacts/faiss:/app/artifacts/faiss:ro
      - hf-cache:/root/.cache/huggingface

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile

    command: python -m factoryassist.ui.gradio_app

    ports:
      - "127.0.0.1:7860:7860"

    environment:
      FACTORYASSIST_API_URL: http://api:8000/ask
      GRADIO_SERVER_NAME: "0.0.0.0"

    depends_on:
      api:
        condition: service_healthy

volumes:
  hf-cache:
