[project]
name = "factoryassist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "st175900", email = "st175900@stud.ims.uni-stuttgart.de" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.4",
    "gradio>=6.31.0",
    "httpx>=0.28.1",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
factoryassist = "factoryassist:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
